name: Code Review

# Trigger the workflow on pull requests
on:
  pull_request:
    branches:
      - main  # Adjust if your default branch is named differently

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # Use the Node.js version compatible with your project
          cache: 'npm'

      # Step 3: Install dependencies (Node.js)
      - name: Install dependencies
        run: npm ci

      # Step 4: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'  # Use the Python version compatible with your script

      # Step 5: Install Python dependencies
      - name: Install Python dependencies
        run: pip install openai

      # Step 6: Run the review script
      - name: Run Code Review
        run: npm run review